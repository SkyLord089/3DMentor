<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Шпаргалки - 3D Моделирование</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="sheets.css">
  <style>
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
    }

    /* Sheet tabs */
    .sheet-tab {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      padding: 10px 6px 8px;
      cursor: pointer;
      transition: all 1.8s ease;
      min-width: 0;
    }
    .sheet-tab:hover { background: #273548; border-color: #4a5568; }
    .sheet-tab.active {
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 18px rgba(0,0,0,.5);
    }
    
    /* Sheet card */
    .sheet-card {
      background: #131c2e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
    }
    
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 28px;
    }
    
    .sheet-header-left { display: flex; align-items: center; gap: 16px; }
    
    .sheet-icon-box {
      width: 52px; height: 52px;
      background: rgba(0,0,0,.25);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }
    
    .sheet-nav-btn {
      width: 38px; height: 38px;
      background: rgba(255,255,255,.15);
      border: none;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: background .6s;
    }
    .sheet-nav-btn:hover { background: rgba(255,255,255,.28); }
    
    .sheet-body { padding: 24px 24px 20px; }
    
    /* Item cards */
    .item-card {
      background: #1a2540;
      border: 1px solid #253050;
      border-radius: 12px;
      padding: 18px 18px 16px;
      transition: border-color 1.8s, transform 1.8s;
    }
    .item-card:hover { border-color: #3d5080; transform: translateY(-2px); }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 1200px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 900px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 700px) {
      .cards-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .cards-grid { grid-template-columns: 1fr; }
      .sheet-tabs-grid { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; }
    }
    
    .item-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    
    .item-kbd-icon {
      display: flex; align-items: center; justify-content: center;
      color: #64748b;
      flex-shrink: 0;
    }
    
    .item-badge {
      font-size: 10px; font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 6px;
    }
    
    .item-title { font-weight: 800; font-size: 15px; color: #f1f5f9; margin-bottom: 7px; line-height: 1.3; }
    .item-desc  { font-size: 13px; color: #8fa3c0; line-height: 1.55; }
    
    /* Sheet footer */
    .sheet-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
      border-top: 1px solid #1e2d44;
      margin-top: 4px;
    }
    
    .sheet-footer-count { font-size: 13px; color: #4a6080; }
    
    .page-pill {
      background: #1e2d44;
      border: 1px solid #2a3d58;
      border-radius: 999px;
      padding: 5px 20px;
      font-size: 14px; font-weight: 700; color: #94a3b8;
    }

    /* Navigation */
    .nav-link {
      transition: color 0.2s;
    }
    .nav-link:hover {
      color: #34d399;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: scale(.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    .fade-slide-in { animation: fadeSlideIn 0.5s cubic-bezier(.4,0,.2,1) both; }
  </style>
</head>
<body class="grid-bg">
  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-xl bg-slate-900/80 border-b border-slate-800/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="Index.html" class="flex items-center gap-3 group">
          <div class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-cyan-500 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-emerald-500/25 group-hover:shadow-emerald-500/40 transition-shadow duration-300">🎯</div>
          <div>
            <span class="text-white font-black text-sm sm:text-base block leading-tight">3D Моделирование</span>
            <p class="text-emerald-400 text-[9px] font-bold uppercase tracking-widest">Для компьютерных игр</p>
          </div>
        </a>
        <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <a href="Index.html#pipeline" class="nav-link text-slate-400">Пайплайн</a>
          <a href="Index.html#quiz" class="nav-link text-slate-400">Тест</a>
          <a href="Index.html" class="nav-link text-slate-400">На главную</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="pt-24 pb-20">
    <section class="py-10 px-4 sm:px-6 lg:px-8">
      <div class="max-w-5xl mx-auto">
        <div class="text-center mb-10">
          <h1 class="text-3xl sm:text-4xl font-black text-white mb-4">Все шпаргалки</h1>
          <p class="text-slate-400 text-lg max-w-2xl mx-auto">
            Выберите тему для подробного изучения. Каждая памятка содержит
            объяснения ключевых понятий 3D графики.
          </p>
        </div>

        <!-- Tab Bar -->
        <div style="background:#131c2e; border:1px solid #1e2d44; border-radius:18px; padding:14px 14px 20px; margin-bottom:12px; position:relative; overflow:hidden;">
          <div class="sheet-tabs-grid" style="display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:6px; position:relative;" id="sheetTabs"></div>
        </div>

        <!-- Sheet Card -->
        <div id="sheetContent"></div>
      </div>
    </section>
  </main>

  <script src="sheets.js"></script>
  <script>
    // Initialize global variables for sheets
    let activeSheet = 1;
    
    // Re-initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      renderSheetTabs();
      renderSheetContent();
    });
  </script>
</body>
</html>
